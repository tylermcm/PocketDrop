name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libcurl4-openssl-dev xvfb

      - name: Build app
        run: bash build_linux.sh

      - name: Inspect and smoke-test app
        run: |
          file build/PocketDrop-linux-x86_64/PocketDrop
          ldd build/PocketDrop-linux-x86_64/PocketDrop
          set +e
          timeout 4s xvfb-run -a build/PocketDrop-linux-x86_64/PocketDrop
          code=$?
          set -e
          test "$code" -eq 124

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install opencv-python-headless pillow

      - name: Build tests
        run: bash tests/build_tests_linux.sh build/tests-linux

      - name: Core tests
        run: |
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
          python tests/verify.py gen "$RUNNER_TEMP/src"
          python tests/server_check.py gen "$RUNNER_TEMP/src"
          build/tests-linux/core_test "$RUNNER_TEMP/out" "$RUNNER_TEMP/src/Photos Trip" "$RUNNER_TEMP/src/single.csv"
          python tests/verify.py check "$RUNNER_TEMP/out" "$RUNNER_TEMP/src"

      - name: HTTP server tests
        run: |
          build/tests-linux/server_test 90 "$RUNNER_TEMP/src/Photos Trip" "$RUNNER_TEMP/src/single.csv" &
          sleep 2
          node tests/check_page_js.mjs
          python tests/server_check.py check "$RUNNER_TEMP/src"
          wait

      - name: Tunnel test
        continue-on-error: true
        timeout-minutes: 5
        run: build/tests-linux/tunnel_test 90 --download

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDrop-linux
          path: build/PocketDrop-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: bash build_mac.sh

      - name: Inspect app
        run: |
          lipo -info build/PocketDrop.app/Contents/MacOS/PocketDrop
          codesign --verify --verbose build/PocketDrop.app
          ls -la build/PocketDrop.app/Contents/MacOS build/PocketDrop-mac.zip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install opencv-python-headless pillow

      - name: Build tests
        run: bash tests/build_tests.sh build/tests

      - name: Core tests (QR, deflate, zip)
        run: |
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
          python tests/verify.py gen "$RUNNER_TEMP/src"
          python tests/server_check.py gen "$RUNNER_TEMP/src"
          build/tests/core_test "$RUNNER_TEMP/out" "$RUNNER_TEMP/src/Photos Trip" "$RUNNER_TEMP/src/single.csv"
          python tests/verify.py check "$RUNNER_TEMP/out" "$RUNNER_TEMP/src"

      - name: HTTP server tests
        run: |
          build/tests/server_test 90 "$RUNNER_TEMP/src/Photos Trip" "$RUNNER_TEMP/src/single.csv" &
          sleep 2
          node tests/check_page_js.mjs
          python tests/server_check.py check "$RUNNER_TEMP/src"
          wait

      - name: Tunnel test (downloads cloudflared)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          build/tests/tunnel_test 90 --download
          echo "--- cloudflared.log ---"
          grep -E "PocketDrop\]|Registered|ERR" "$HOME/Library/Application Support/PocketDrop/cloudflared.log" || true

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDrop-mac
          path: build/PocketDrop-mac.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        shell: cmd
        run: build.bat

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --version=6.7.3 -y --no-progress }
          $env:ISCC = $compiler
          cmd /c build_installer.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build desktop regression harness
        shell: cmd
        run: tests\build_desktop_test.bat

      - name: Desktop geometry and renders
        run: build\tests\desktop_test.exe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install opencv-python-headless pillow

      - name: Build tests
        shell: cmd
        run: tests\build_tests.bat build\tests

      - name: Decode rendered desktop QR codes
        run: python tests/check_renders.py

      - name: Core and HTTP server tests
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\src"; $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $src, $out | Out-Null
          python tests/verify.py gen $src
          python tests/server_check.py gen $src
          build\tests\core_test.exe $out "$src\Photos Trip" "$src\single.csv"
          python tests/verify.py check $out $src
          if ($LASTEXITCODE) { exit 1 }
          build\tests\update_test.exe
          if ($LASTEXITCODE) { exit 1 }
          build\tests\discovery_test.exe
          if ($LASTEXITCODE) { exit 1 }
          build\tests\pc_transfer_test.exe
          if ($LASTEXITCODE) { exit 1 }
          python tests/nearby_check.py
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process -PassThru -NoNewWindow build\tests\server_test.exe -ArgumentList 90, "`"$src\Photos Trip`"", "`"$src\single.csv`""
          Start-Sleep 2
          node tests/check_page_js.mjs
          if ($LASTEXITCODE) { exit 1 }
          python tests/server_check.py check $src
          if ($LASTEXITCODE) { exit 1 }
          $p.WaitForExit(20000) | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDrop-windows
          path: |
            build/PocketDrop.exe
            build/PocketDrop-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PocketDrop-ui-renders
          path: build/renders/*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: PocketDrop-*
          path: artifacts
      - name: Prepare release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
            --title "PocketDrop $GITHUB_REF_NAME" \
            artifacts/PocketDrop-windows/* artifacts/PocketDrop-mac/* artifacts/PocketDrop-linux/*
